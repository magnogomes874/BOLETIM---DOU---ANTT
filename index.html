<!DOCTYPE html>
<!-- GitHub Pages -->
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Boletim DOU - ANTT</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f6f8;
      color: #111827;
    }

    .container {
      max-width: 850px;
      margin: 40px auto;
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 30px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin-top: 0;
      margin-bottom: 8px;
      font-size: 28px;
    }

    .subtitulo {
      margin-top: 0;
      margin-bottom: 30px;
      color: #6b7280;
    }

    .campo {
      margin-bottom: 24px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }

    input[type="date"],
    input[type="file"] {
      width: 100%;
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      background: white;
    }

    .secao {
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 18px;
      margin-bottom: 18px;
    }

    .secao h2 {
      margin-top: 0;
      font-size: 18px;
    }

    .arquivo-selecionado {
      margin-top: 8px;
      font-size: 13px;
      color: #4b5563;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 9px;
      padding: 14px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      background: #111827;
      color: white;
    }

    button:hover {
      opacity: 0.92;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    #resultado {
      display: none;
      margin-top: 25px;
    }

    .resultado-card {
      border-radius: 10px;
      padding: 18px;
      margin-bottom: 12px;
      border: 1px solid #d1d5db;
      background: #f9fafb;
    }

    .sucesso {
      background: #ecfdf5;
      border-color: #a7f3d0;
    }

    .processando {
      background: #eff6ff;
      border-color: #bfdbfe;
    }

    .erro {
      background: #fef2f2;
      border-color: #fecaca;
      color: #991b1b;
    }

    .status-titulo {
      font-weight: bold;
      margin-bottom: 7px;
    }

    .progresso {
      margin-top: 8px;
      font-size: 13px;
      color: #4b5563;
    }

    .resumo-final {
      margin-top: 20px;
      padding: 20px;
      background: #ecfdf5;
      border: 1px solid #a7f3d0;
      border-radius: 10px;
    }

    .resumo-final h3 {
      margin-top: 0;
    }

  </style>

</head>

<body>

  <div class="container">

    <div class="card">

      <h1>
        Boletim DOU - ANTT
      </h1>

      <p class="subtitulo">
        Selecione os PDFs das Seções 1, 2 e 3 do Diário Oficial da União.
      </p>

      <div class="campo">

        <label for="dataDou">
          Data do DOU
        </label>

        <input
          type="date"
          id="dataDou"
        >

      </div>


      <div class="secao">

        <h2>
          Seção 1
        </h2>

        <input
          type="file"
          id="pdfSecao1"
          accept="application/pdf,.pdf"
        >

        <div
          class="arquivo-selecionado"
          id="nomeSecao1"
        ></div>

      </div>


      <div class="secao">

        <h2>
          Seção 2
        </h2>

        <input
          type="file"
          id="pdfSecao2"
          accept="application/pdf,.pdf"
        >

        <div
          class="arquivo-selecionado"
          id="nomeSecao2"
        ></div>

      </div>


      <div class="secao">

        <h2>
          Seção 3
        </h2>

        <input
          type="file"
          id="pdfSecao3"
          accept="application/pdf,.pdf"
        >

        <div
          class="arquivo-selecionado"
          id="nomeSecao3"
        ></div>

      </div>


      <button id="btnProcessar">
        PROCESSAR DOU
      </button>


      <div id="resultado"></div>

    </div>

  </div>


  <!--
    PDF.js

    A biblioteca é utilizada somente para ler
    os PDFs selecionados no navegador.
  -->

  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"
  ></script>


  <script>

    // ============================================================
    // CONFIGURAÇÃO DO PDF.JS
    // ============================================================

    pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';


    // ============================================================
    // ELEMENTOS DA INTERFACE
    // ============================================================

    const dataDou =
      document.getElementById('dataDou');

    const pdfSecao1 =
      document.getElementById('pdfSecao1');

    const pdfSecao2 =
      document.getElementById('pdfSecao2');

    const pdfSecao3 =
      document.getElementById('pdfSecao3');

    const nomeSecao1 =
      document.getElementById('nomeSecao1');

    const nomeSecao2 =
      document.getElementById('nomeSecao2');

    const nomeSecao3 =
      document.getElementById('nomeSecao3');

    const btnProcessar =
      document.getElementById('btnProcessar');

    const resultado =
      document.getElementById('resultado');


    // ============================================================
    // MEMÓRIA DO SISTEMA
    // ============================================================

    window.textosDOU = {
      1: '',
      2: '',
      3: ''
    };


    window.resultadoExtracaoDOU = {
      1: null,
      2: null,
      3: null
    };


    // ============================================================
    // MOSTRAR NOME DOS ARQUIVOS
    // ============================================================

    function mostrarNomeArquivo(
      input,
      elemento
    ) {

      if (!input.files[0]) {

        elemento.textContent = '';

        return;

      }

      const arquivo =
        input.files[0];

      const tamanhoMB =
        (
          arquivo.size /
          1024 /
          1024
        ).toFixed(2);

      elemento.textContent =
        `Arquivo selecionado: ${arquivo.name} (${tamanhoMB} MB)`;

    }


    pdfSecao1.addEventListener(
      'change',
      function () {

        mostrarNomeArquivo(
          pdfSecao1,
          nomeSecao1
        );

      }
    );


    pdfSecao2.addEventListener(
      'change',
      function () {

        mostrarNomeArquivo(
          pdfSecao2,
          nomeSecao2
        );

      }
    );


    pdfSecao3.addEventListener(
      'change',
      function () {

        mostrarNomeArquivo(
          pdfSecao3,
          nomeSecao3
        );

      }
    );


    // ============================================================
    // INTERFACE DE STATUS
    // ============================================================

    function criarAreasResultado() {

      resultado.style.display =
        'block';

      resultado.innerHTML = `

        <div
          id="statusSecao1"
          class="resultado-card"
        >
          <div class="status-titulo">
            Seção 1
          </div>

          <div id="textoStatus1">
            Aguardando...
          </div>
        </div>


        <div
          id="statusSecao2"
          class="resultado-card"
        >
          <div class="status-titulo">
            Seção 2
          </div>

          <div id="textoStatus2">
            Aguardando...
          </div>
        </div>


        <div
          id="statusSecao3"
          class="resultado-card"
        >
          <div class="status-titulo">
            Seção 3
          </div>

          <div id="textoStatus3">
            Aguardando...
          </div>
        </div>


        <div
          id="resumoFinal"
        ></div>

      `;

    }


    function atualizarStatus(
      secao,
      mensagem,
      tipo = ''
    ) {

      const card =
        document.getElementById(
          `statusSecao${secao}`
        );

      const texto =
        document.getElementById(
          `textoStatus${secao}`
        );

      if (!card || !texto) {
        return;
      }

      card.className =
        'resultado-card';

      if (tipo) {

        card.classList.add(
          tipo
        );

      }

      texto.innerHTML =
        mensagem;

    }


    // ============================================================
    // VALIDAÇÕES
    // ============================================================

    function validarArquivos() {

      if (!dataDou.value) {

        alert(
          'Informe a data do DOU.'
        );

        return false;

      }


      if (!pdfSecao1.files[0]) {

        alert(
          'Selecione o PDF da Seção 1.'
        );

        return false;

      }


      if (!pdfSecao2.files[0]) {

        alert(
          'Selecione o PDF da Seção 2.'
        );

        return false;

      }


      if (!pdfSecao3.files[0]) {

        alert(
          'Selecione o PDF da Seção 3.'
        );

        return false;

      }


      return true;

    }


    // ============================================================
    // EXTRAÇÃO DE UMA PÁGINA
    // ============================================================

    function montarTextoPagina(
      itens
    ) {

      let texto =
        '';


      for (const item of itens) {

        const trecho =
          String(
            item.str || ''
          );


        if (!trecho) {
          continue;
        }


        texto +=
          trecho;


        if (item.hasEOL) {

          texto +=
            '\n';

        } else {

          texto +=
            ' ';

        }

      }


      return texto
        .replace(/[ \t]+\n/g, '\n')
        .replace(/[ \t]{2,}/g, ' ')
        .trim();

    }


    // ============================================================
    // EXTRAÇÃO DO PDF
    // ============================================================

    async function extrairPDF(
      arquivo,
      secao
    ) {

      atualizarStatus(
        secao,
        'Carregando o PDF...',
        'processando'
      );


      const arrayBuffer =
        await arquivo.arrayBuffer();


      const tarefaPDF =
        pdfjsLib.getDocument({
          data: arrayBuffer
        });


      const pdf =
        await tarefaPDF.promise;


      const totalPaginas =
        pdf.numPages;


      let textoCompleto =
        '';


      for (
        let paginaNumero = 1;
        paginaNumero <= totalPaginas;
        paginaNumero++
      ) {

        atualizarStatus(
          secao,
          `
            Extraindo página
            <strong>${paginaNumero}</strong>
            de
            <strong>${totalPaginas}</strong>...
          `,
          'processando'
        );


        const pagina =
          await pdf.getPage(
            paginaNumero
          );


        const conteudo =
          await pagina.getTextContent();


        const textoPagina =
          montarTextoPagina(
            conteudo.items
          );


        textoCompleto +=
          `\n${textoPagina}\n`;


        pagina.cleanup();


        /*
          Pequena pausa a cada 10 páginas.

          Isso evita travar a interface
          durante PDFs muito grandes.
        */

        if (
          paginaNumero % 10 === 0
        ) {

          await new Promise(
            resolve =>
              setTimeout(
                resolve,
                0
              )
          );

        }

      }


      textoCompleto =
        textoCompleto
          .replace(/\r/g, '')
          .replace(/\n{3,}/g, '\n\n')
          .trim();


      const quantidadeCaracteres =
        textoCompleto.length;


      window.textosDOU[secao] =
        textoCompleto;


      window.resultadoExtracaoDOU[secao] = {

        secao:
          String(secao),

        nomeArquivo:
          arquivo.name,

        tamanhoArquivo:
          arquivo.size,

        paginas:
          totalPaginas,

        caracteres:
          quantidadeCaracteres

      };


      atualizarStatus(
        secao,
        `
          ✅ Extração concluída.
          <br><br>

          <strong>Páginas:</strong>
          ${totalPaginas}

          <br>

          <strong>Caracteres extraídos:</strong>
          ${quantidadeCaracteres.toLocaleString('pt-BR')}

          <br>

          <strong>Arquivo:</strong>
          ${arquivo.name}
        `,
        'sucesso'
      );


      await pdf.destroy();


      return {
        texto:
          textoCompleto,

        paginas:
          totalPaginas,

        caracteres:
          quantidadeCaracteres
      };

    }


    // ============================================================
    // RESUMO FINAL
    // ============================================================

    function mostrarResumoFinal() {

      const resumo =
        document.getElementById(
          'resumoFinal'
        );


      const secao1 =
        window.resultadoExtracaoDOU[1];

      const secao2 =
        window.resultadoExtracaoDOU[2];

      const secao3 =
        window.resultadoExtracaoDOU[3];


      const totalPaginas =
        secao1.paginas +
        secao2.paginas +
        secao3.paginas;


      const totalCaracteres =
        secao1.caracteres +
        secao2.caracteres +
        secao3.caracteres;


      resumo.innerHTML = `

        <div class="resumo-final">

          <h3>
            ✅ Extração concluída
          </h3>

          <strong>
            DOU:
          </strong>

          ${dataDou.value}

          <br><br>


          <strong>
            Seção 1:
          </strong>

          ${secao1.paginas} páginas

          <br>


          <strong>
            Seção 2:
          </strong>

          ${secao2.paginas} páginas

          <br>


          <strong>
            Seção 3:
          </strong>

          ${secao3.paginas} páginas

          <br><br>


          <strong>
            Total de páginas:
          </strong>

          ${totalPaginas}

          <br>


          <strong>
            Total de caracteres extraídos:
          </strong>

          ${totalCaracteres.toLocaleString('pt-BR')}

          <br><br>

          Próxima etapa:
          identificar as publicações candidatas
          de cada seção.

        </div>

      `;

    }


    // ============================================================
    // PROCESSAMENTO PRINCIPAL
    // ============================================================

    async function processarDOU() {

      if (!validarArquivos()) {
        return;
      }


      criarAreasResultado();


      btnProcessar.disabled =
        true;


      btnProcessar.textContent =
        'PROCESSANDO...';


      window.textosDOU = {
        1: '',
        2: '',
        3: ''
      };


      window.resultadoExtracaoDOU = {
        1: null,
        2: null,
        3: null
      };


      try {

        /*
          Processamos um PDF por vez.

          Isso é proposital para reduzir
          o consumo de memória do navegador.
        */


        await extrairPDF(
          pdfSecao1.files[0],
          1
        );


        await extrairPDF(
          pdfSecao2.files[0],
          2
        );


        await extrairPDF(
          pdfSecao3.files[0],
          3
        );


        mostrarResumoFinal();


      } catch (erro) {

        console.error(
          erro
        );


        resultado.innerHTML += `

          <div class="resultado-card erro">

            <div class="status-titulo">
              Erro durante o processamento
            </div>

            ${erro.message || erro}

          </div>

        `;

      } finally {

        btnProcessar.disabled =
          false;


        btnProcessar.textContent =
          'PROCESSAR DOU';

      }

    }


    // ============================================================
    // BOTÃO PROCESSAR
    // ============================================================

    btnProcessar.addEventListener(
      'click',
      processarDOU
    );

  </script>

</body>

</html>
