<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boletim DOU - ANTT</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f6f8;
      color: #111827;
    }

    .container {
      max-width: 900px;
      margin: 40px auto;
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 30px;
      box-shadow: 0 4px 18px rgba(0,0,0,.08);
    }

    h1 { margin-top: 0; margin-bottom: 8px; }
    .subtitulo { color: #6b7280; margin-top: 0; margin-bottom: 28px; }

    .campo, .secao { margin-bottom: 18px; }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }

    input[type="date"],
    input[type="file"] {
      width: 100%;
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      background: #fff;
    }

    .secao {
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 18px;
    }

    .secao h2 { margin-top: 0; font-size: 18px; }

    .arquivo-selecionado {
      margin-top: 8px;
      font-size: 13px;
      color: #4b5563;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 9px;
      padding: 14px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      background: #111827;
      color: #fff;
    }

    button:disabled { opacity: .55; cursor: not-allowed; }

    #resultado {
      display: none;
      margin-top: 24px;
    }

    .resultado-card,
    .resumo-final,
    .candidatos-card {
      border-radius: 10px;
      padding: 18px;
      margin-bottom: 12px;
      border: 1px solid #d1d5db;
      background: #f9fafb;
    }

    .processando {
      background: #eff6ff;
      border-color: #bfdbfe;
    }

    .sucesso,
    .resumo-final {
      background: #ecfdf5;
      border-color: #a7f3d0;
    }

    .erro {
      background: #fef2f2;
      border-color: #fecaca;
      color: #991b1b;
    }

    .candidatos-card {
      background: #eff6ff;
      border-color: #bfdbfe;
    }

    .status-titulo {
      font-weight: bold;
      margin-bottom: 7px;
    }

    .numero {
      font-size: 24px;
      font-weight: bold;
    }

    .amostra {
      margin-top: 14px;
      padding: 12px;
      background: white;
      border-radius: 8px;
      max-height: 230px;
      overflow-y: auto;
      border: 1px solid #dbeafe;
    }

    .amostra div {
      padding: 6px 0;
      border-bottom: 1px solid #e5e7eb;
      font-size: 13px;
    }

    .amostra div:last-child { border-bottom: 0; }
  
    .boletim-preview {
      background: #ffffff;
      border: 1px solid #c9c9c9;
      margin-top: 18px;
      font-family: Arial, Helvetica, sans-serif;
      color: #111111;
    }

    .boletim-banner {
      background: linear-gradient(90deg, #0f4f88, #0c6b74, #6a8f3a);
      color: #ffffff;
      padding: 24px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;

    .boletim-banner .antt {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .boletim-banner .dou-legis {

    .boletim-topo {

      line-height: 1.9;
      font-weight: 700;
      font-size: 18px;
    }

    .boletim-faixa {
      background: #233f73;
      color: #ffffff;
      text-align: center;
      padding: 18px 16px;
      font-weight: 800;
      font-size: 18px;
      letter-spacing: 0.2px;
    }

    .boletim-conteudo {
      padding: 34px 24px 42px;
    }

    .boletim-secao {
      margin-top: 10px;
      margin-bottom: 44px;
    }

    .boletim-secao-titulo {
      text-align: center;
      text-decoration: underline;
      font-weight: 700;
      margin-bottom: 26px;
    }

    .boletim-orgao-principal {
      text-align: center;
      font-weight: 700;
      color: #163a68;
      margin-bottom: 22px;
    }

    .boletim-unidade {
      text-align: center;
      color: #163a68;
      margin: 8px 0 26px;
      font-size: 14px;
    }

    .boletim-publicacao {
      margin-bottom: 34px;
      page-break-inside: avoid;
    }

    .boletim-publicacao-titulo {
      font-weight: 700;
      margin-bottom: 16px;
      text-transform: uppercase;
    }

    .boletim-publicacao-corpo {
      white-space: pre-wrap;
      line-height: 1.55;
      text-align: left;
      font-size: 14px;
    }

    .boletim-orgao-externo {
      text-align: center;
      font-weight: 700;
      color: #163a68;
      margin: 20px 0 18px;
    }

    @media print {
      body * {
        visibility: hidden !important;
      }

      #previaBoletim,
      #previaBoletim * {
        visibility: visible !important;
      }

      #previaBoletim {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
      }

      .boletim-preview {
        border: 0;
      }
    }

  </style>

<body>
  <div class="container">
    <div class="card">

      <h1>Boletim DOU - ANTT</h1>
      <p class="subtitulo">
        Insira os PDFs das Seções 1, 2 e 3 do Diário Oficial da União.
      </p>

      <div class="campo">
        <label for="dataDou">Data do DOU</label>
        <input type="date" id="dataDou">
      </div>

      <div class="secao">
        <h2>Seção 1</h2>
        <input type="file" id="pdfSecao1" accept="application/pdf,.pdf">
        <div class="arquivo-selecionado" id="nomeSecao1"></div>
      </div>

      <div class="secao">
        <h2>Seção 2</h2>
        <input type="file" id="pdfSecao2" accept="application/pdf,.pdf">
        <div class="arquivo-selecionado" id="nomeSecao2"></div>
      </div>

      <div class="secao">
        <h2>Seção 3</h2>
        <input type="file" id="pdfSecao3" accept="application/pdf,.pdf">
        <div class="arquivo-selecionado" id="nomeSecao3"></div>
      </div>

      <button id="btnProcessar">PROCESSAR DOU</button>
      <div id="resultado"></div>

    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    const dataDou = document.getElementById('dataDou');
    const pdfSecao1 = document.getElementById('pdfSecao1');
    const pdfSecao2 = document.getElementById('pdfSecao2');
    const pdfSecao3 = document.getElementById('pdfSecao3');
    const nomeSecao1 = document.getElementById('nomeSecao1');
    const nomeSecao2 = document.getElementById('nomeSecao2');
    const nomeSecao3 = document.getElementById('nomeSecao3');
    const btnProcessar = document.getElementById('btnProcessar');
    const resultado = document.getElementById('resultado');

    window.textosDOU = { 1: '', 2: '', 3: '' };
    window.resultadoExtracaoDOU = { 1: null, 2: null, 3: null };
    window.candidatosDOU = { 1: [], 2: [], 3: [] };
    window.publicacoesDOU = { 1: [], 2: [], 3: [] };
    window.relevantesDOU = { 1: [], 2: [], 3: [] };
    window.contextosCorrigidosDOU = { 1: [], 2: [], 3: [] };

    function mostrarNomeArquivo(input, elemento) {
      if (!input.files[0]) {
        elemento.textContent = '';
        return;
      }

      const arquivo = input.files[0];
      const tamanhoMB = (arquivo.size / 1024 / 1024).toFixed(2);
      elemento.textContent =
        `Arquivo selecionado: ${arquivo.name} (${tamanhoMB} MB)`;
    }

    pdfSecao1.addEventListener('change', () => mostrarNomeArquivo(pdfSecao1, nomeSecao1));
    pdfSecao2.addEventListener('change', () => mostrarNomeArquivo(pdfSecao2, nomeSecao2));
    pdfSecao3.addEventListener('change', () => mostrarNomeArquivo(pdfSecao3, nomeSecao3));

    function escaparHTML(texto) {
      return String(texto || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function criarAreasResultado() {
      resultado.style.display = 'block';
      resultado.innerHTML = `
        <div id="statusSecao1" class="resultado-card">
          <div class="status-titulo">Seção 1</div>
          <div id="textoStatus1">Aguardando...</div>
        </div>

        <div id="statusSecao2" class="resultado-card">
          <div class="status-titulo">Seção 2</div>
          <div id="textoStatus2">Aguardando...</div>
        </div>

        <div id="statusSecao3" class="resultado-card">
          <div class="status-titulo">Seção 3</div>
          <div id="textoStatus3">Aguardando...</div>
        </div>

        <div id="resumoFinal"></div>
        <div id="resultadoCandidatos"></div>
        <div id="resultadoPublicacoes"></div>
        <div id="resultadoRelevancia"></div>
        <div id="resultadoContexto"></div>
        
        <div class="candidatos-card" id="blocoBoletim">
          <h3>Prévia do Boletim DOU</h3>

          <p>
            Gere a prévia com as publicações relevantes já processadas.
          </p>

          <div style="display:flex;gap:12px;flex-wrap:wrap;margin:12px 0;">
            <div style="flex:1;min-width:220px;">
              <label for="numeroDouBoletim"><strong>Nº do DOU</strong></label>
              <input
                id="numeroDouBoletim"
                type="text"
                placeholder="Ex.: 168"
                style="width:100%;padding:10px;margin-top:6px;box-sizing:border-box;"
              >
            </div>

            <div style="flex:1;min-width:220px;">
              <label for="dataDouBoletim"><strong>Data do DOU</strong></label>
              <input
                id="dataDouBoletim"
                type="date"
                style="width:100%;padding:10px;margin-top:6px;box-sizing:border-box;"
              >
            </div>
          </div>

          <button
            id="btnGerarBoletim"
            type="button"
            onclick="gerarPreviaBoletim()"
            style="padding:12px 18px;font-weight:700;cursor:pointer;margin-right:8px;"
          >
            GERAR BOLETIM
          </button>

          <button
            id="btnImprimirBoletim"
            type="button"
            onclick="imprimirBoletim()"
            style="padding:12px 18px;font-weight:700;cursor:pointer;"
          >
            IMPRIMIR / SALVAR EM PDF
          </button>

          <div id="statusBoletim" style="margin-top:12px;"></div>

          <div
            id="previaBoletim"
            style="margin-top:18px;"
          ></div>
        </div>

<div class="candidatos-card" id="blocoGoogleSheets">
          <h3>Google Sheets</h3>

          <p>
            Depois que o DOU for processado e as publicações relevantes forem identificadas,
            use o botão abaixo para enviar os dados para a planilha.
          </p>

          <div style="margin: 12px 0;">
            <label for="urlAppsScript"><strong>URL do App da Web</strong></label>
            <input
              id="urlAppsScript"
              type="url"
              placeholder="https://script.google.com/macros/s/.../exec"
              style="width:100%;padding:10px;margin-top:6px;box-sizing:border-box;"
            >
          </div>

          <div style="margin: 12px 0;">
            <label for="chaveApiSheets"><strong>Chave de acesso</strong></label>
            <input
              id="chaveApiSheets"
              type="password"
              placeholder="Digite a CHAVE_API"
              autocomplete="off"
              style="width:100%;padding:10px;margin-top:6px;box-sizing:border-box;"
            >
          </div>

          <button
            id="btnEnviarSheets"
            type="button"
            onclick="enviarParaGoogleSheets()"
            style="padding:12px 18px;font-weight:700;cursor:pointer;"
          >
            ENVIAR PARA GOOGLE SHEETS
          </button>

          <div id="statusGoogleSheets" style="margin-top:12px;"></div>
        </div>

      `;
    }

    function atualizarStatus(secao, mensagem, tipo = '') {
      const card = document.getElementById(`statusSecao${secao}`);
      const texto = document.getElementById(`textoStatus${secao}`);

      if (!card || !texto) return;

      card.className = 'resultado-card';
      if (tipo) card.classList.add(tipo);
      texto.innerHTML = mensagem;
    }

    function validarArquivos() {
      if (!dataDou.value) {
        alert('Informe a data do DOU.');
        return false;
      }

      if (!pdfSecao1.files[0]) {
        alert('Selecione o PDF da Seção 1.');
        return false;
      }

      if (!pdfSecao2.files[0]) {
        alert('Selecione o PDF da Seção 2.');
        return false;
      }

      if (!pdfSecao3.files[0]) {
        alert('Selecione o PDF da Seção 3.');
        return false;
      }

      return true;
    }

    function montarTextoPagina(itens) {
      if (!Array.isArray(itens) || itens.length === 0) {
        return '';
      }

      let texto = '';
      let yAnterior = null;
      let xFimAnterior = null;
      let alturaAnterior = null;

      const toleranciaYMinima = 1.5;

      for (const item of itens) {
        const trecho = String(item.str || '');

        if (!trecho) {
          continue;
        }

        const transform = Array.isArray(item.transform)
          ? item.transform
          : [];

        const x = Number(transform[4] ?? 0);
        const y = Number(transform[5] ?? 0);

        const largura = Number(item.width ?? 0);
        const altura = Math.abs(
          Number(item.height ?? transform[3] ?? 0)
        );

        if (yAnterior === null) {
          texto += trecho;
        } else {
          const toleranciaY = Math.max(
            toleranciaYMinima,
            Math.min(
              4,
              Math.max(
                alturaAnterior || 0,
                altura || 0
              ) * 0.35
            )
          );

          const mudouLinha =
            Math.abs(y - yAnterior) > toleranciaY;

          /*
            O PDF do DOU usa colunas.

            Quando o extrator muda de uma coluna para outra,
            a coordenada Y também muda bastante. Por isso,
            tratamos a mudança como nova linha, sem reordenar
            os itens do PDF.js. Assim preservamos a ordem de
            leitura entregue pelo próprio PDF.
          */

          if (mudouLinha) {
            texto += '\n';
          } else {
            const distanciaX =
              xFimAnterior === null
                ? 0
                : x - xFimAnterior;

            /*
              Se dois blocos estiverem na mesma linha,
              inserimos espaço somente quando necessário.
            */

            if (
              texto &&
              !texto.endsWith('\n') &&
              !texto.endsWith(' ') &&
              distanciaX > 0.5
            ) {
              texto += ' ';
            }
          }

          texto += trecho;
        }

        yAnterior = y;
        xFimAnterior = x + largura;
        alturaAnterior = altura;

        /*
          Alguns PDFs já sinalizam explicitamente fim de linha.
          Mantemos esse sinal quando existir.
        */

        if (item.hasEOL) {
          texto += '\n';
          yAnterior = null;
          xFimAnterior = null;
          alturaAnterior = null;
        }
      }

      return texto
        .replace(/[ \t]+\n/g, '\n')
        .replace(/[ \t]{2,}/g, ' ')
        .replace(/\n{3,}/g, '\n\n')
        .trim();
    }

    async function extrairPDF(arquivo, secao) {
      atualizarStatus(secao, 'Carregando o PDF...', 'processando');

      const arrayBuffer = await arquivo.arrayBuffer();
      const tarefaPDF = pdfjsLib.getDocument({ data: arrayBuffer });
      const pdf = await tarefaPDF.promise;

      const totalPaginas = pdf.numPages;
      let textoCompleto = '';

      for (let paginaNumero = 1; paginaNumero <= totalPaginas; paginaNumero++) {
        atualizarStatus(
          secao,
          `Extraindo página <strong>${paginaNumero}</strong> de <strong>${totalPaginas}</strong>...`,
          'processando'
        );

        const pagina = await pdf.getPage(paginaNumero);
        const conteudo = await pagina.getTextContent();
        const textoPagina = montarTextoPagina(conteudo.items);

        textoCompleto += `\n${textoPagina}\n`;
        pagina.cleanup();

        if (paginaNumero % 10 === 0) {
          await new Promise(resolve => setTimeout(resolve, 0));
        }
      }

      textoCompleto = textoCompleto
        .replace(/\r/g, '')
        .replace(/\n{3,}/g, '\n\n')
        .trim();

      window.textosDOU[secao] = textoCompleto;

      window.resultadoExtracaoDOU[secao] = {
        secao: String(secao),
        nomeArquivo: arquivo.name,
        paginas: totalPaginas,
        caracteres: textoCompleto.length
      };

      atualizarStatus(
        secao,
        `✅ Extração concluída.<br><br>
         <strong>Páginas:</strong> ${totalPaginas}<br>
         <strong>Caracteres:</strong> ${textoCompleto.length.toLocaleString('pt-BR')}<br>
         <strong>Arquivo:</strong> ${escaparHTML(arquivo.name)}`,
        'sucesso'
      );

      await pdf.destroy();
    }

    // ============================================================
    // MIGRAÇÃO DO NODE:
    // CODE - CLASSIFICAR CANDIDATOS POR SEÇÃO
    // ============================================================

    function normalizar(texto) {
      return String(texto || '')
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .replace(/\u00A0/g, ' ')
        .replace(/[ \t]+/g, ' ')
        .trim();
    }

    function normalizarMaiusculo(texto) {
      return normalizar(texto).toUpperCase();
    }

    function linhaEmCaixaAlta(linha) {
      const texto = normalizar(linha);

      if (!texto) {
        return false;
      }

      const letras = texto.replace(/[^A-Za-zÀ-ÖØ-öø-ÿ]/g, '');

      if (!letras) {
        return false;
      }

      return letras === letras.toUpperCase();
    }

    function corrigirTipografiaDOU(linha) {
      let texto = normalizar(linha);

      texto = texto.replace(
        /^R\s*E\s*T\s*I\s*F\s*I\s*C\s*A\s*[ÇC]\s*[ÃA]\s*O$/i,
        'RETIFICAÇÃO'
      );

      texto = texto.replace(
        /^A\s*V\s*I\s*S\s*O$/i,
        'AVISO'
      );

      texto = texto.replace(
        /^C\s*O\s*M\s*U\s*N\s*I\s*C\s*A\s*D\s*O$/i,
        'COMUNICADO'
      );

      return texto;
    }

    function detectarSecao1(linha) {
      const original = corrigirTipografiaDOU(linha);
      const n = normalizarMaiusculo(original);

      if (!linhaEmCaixaAlta(original)) {
        return null;
      }

      const padroesANTT = [
        /^DELIBERACAO ANTT Nº/,
        /^RESOLUCAO ANTT Nº/,
        /^INSTRUCAO NORMATIVA ANTT Nº/,
        /^PORTARIA ANTT Nº/,
        /^PORTARIA SUSPI Nº/,
        /^PORTARIA SUROD Nº/,
        /^PORTARIA SUPAS Nº/,
        /^PORTARIA SUFER Nº/,
        /^PORTARIA SUDEG Nº/,
        /^DECISAO SUROD Nº/,
        /^DECISAO SUROC Nº/,
        /^DECISAO SUFER Nº/,
        /^DECISAO SUPAS Nº/,
        /^DECISAO SUESP Nº/
      ];

      if (padroesANTT.some(regex => regex.test(n))) {
        return original;
      }

      const padroesGerais = [
        /^PORTARIA\b/,
        /^DELIBERACAO\b/,
        /^RESOLUCAO\b/,
        /^INSTRUCAO NORMATIVA\b/,
        /^DECISAO\b/,
        /^DESPACHO\b/,
        /^ATO\b/,
        /^ORDEM DE SERVICO\b/,
        /^NORMA\b/,
        /^REGULAMENTO\b/,
        /^RETIFICACAO\b/,
        /^SUMULA\b/
      ];

      if (padroesGerais.some(regex => regex.test(n))) {
        return original;
      }

      return null;
    }

    function detectarSecao2(linha) {
      const original = corrigirTipografiaDOU(linha);
      const n = normalizarMaiusculo(original);

      if (!linhaEmCaixaAlta(original)) {
        return null;
      }

      const padroes = [
        /^PORTARIA DE PESSOAL Nº/,
        /^PORTARIA DG Nº/,
        /^PORTARIA CONJUNTA\b/,
        /^PORTARIA\b/,
        /^DESPACHO\b/,
        /^ATO\b/,
        /^DECISAO\b/,
        /^RESOLUCAO\b/,
        /^EDITAL\b/,
        /^RETIFICACAO\b/
      ];

      if (padroes.some(regex => regex.test(n))) {
        return original;
      }

      return null;
    }

    function detectarSecao3(linha) {
      const original = corrigirTipografiaDOU(linha);
      const n = normalizarMaiusculo(original);

      if (!linhaEmCaixaAlta(original)) {
        return null;
      }

      const padroes = [
        /^EXTRATO\b/,
        /^EXTRATOS\b/,
        /^EDITAL\b/,
        /^EDITAIS\b/,
        /^AVISO\b/,
        /^AVISOS\b/,
        /^COMUNICADO\b/,
        /^COMUNICADOS\b/,
        /^RESULTADO DE JULGAMENTO\b/,
        /^RESULTADOS DE JULGAMENTO\b/,
        /^RESULTADO\b/,
        /^RESULTADOS\b/,
        /^RETIFICACAO\b/
      ];

      if (padroes.some(regex => regex.test(n))) {
        return original;
      }

      return null;
    }

    function detectarCabecalho(secao, linha) {
      if (secao === '1') return detectarSecao1(linha);
      if (secao === '2') return detectarSecao2(linha);
      if (secao === '3') return detectarSecao3(linha);
      return null;
    }

    function classificarCandidatos(texto, secao) {
      const linhas = texto.replace(/\r/g, '').split('\n');
      const candidatos = [];
      let posicaoAtual = 0;

      for (const linhaOriginal of linhas) {
        const linha = normalizar(linhaOriginal);

        if (linha) {
          const cabecalho = detectarCabecalho(String(secao), linha);

          if (cabecalho) {

    function limparTexto(texto) {
      return String(texto || '')
        .replace(/\r/g, '')
        .replace(/\u00A0/g, ' ')
        .replace(/\*/g, '')
        .replace(/[ \t]+/g, ' ')
        .replace(/\n{3,}/g, '\n\n')
        .trim();
    }

    function normalizarExtracao(texto) {
      return String(texto || '')
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .replace(/\u00A0/g, ' ')
        .replace(/\r/g, '')
        .replace(/[ \t]+/g, ' ')
        .toUpperCase()
        .trim();
    }

    function linhaEmCaixaAltaExtracao(linha) {
      const l = String(linha || '').trim();
      if (!l) return false;
      return !/[a-zà-öø-ÿ]/.test(l);
    }

    function ehCabecalhoPublicacao(linha) {
      const n = normalizarExtracao(linha);

      if (!n) return false;

      const padroes = [
        /^PORTARIA\b/,

        /^DELIBERACAO\b/,

    function ehLinhaInstitucional(linha) {

      ];

      return padroes.some(regex => regex.test(n));
    }

    function contextoEhANTT(contexto) {
      const n = normalizarExtracao(contexto);

      return (
        /AGENCIA NACIONAL DE TRANSPORTES TERRESTRES/.test(n) ||
        /\bANTT\b/.test(n)
      );
    }

    function encontrarContextoInstitucional(texto, posicaoPublicacao) {
      const inicioJanela = Math.max(0, posicaoPublicacao - 8000);

      const trecho = texto.substring(
        inicioJanela,
        posicaoPublicacao
      );

      const linhas = trecho
        .replace(/\r/g, '')
        .split('\n');

      const encontradas = [];

      let encontrouInstituicao = false;

      for (let i = linhas.length - 1; i >= 0; i--) {
        const linha = limparTexto(linhas[i]);

        if (!linha) {
          continue;
        }

        if (
          encontrouInstituicao &&
          ehCabecalhoPublicacao(linha)
        ) {
          break;
        }

        if (ehLinhaInstitucional(linha)) {
          encontradas.unshift(linha);

          encontrouInstituicao = true;

          if (encontradas.length >= 5) {
            break;
          }
        }
      }

      return encontradas.join('\n');
    }

    function ehCabecalhoInstitucionalForte(linha) {
      const original = String(linha || '')
        .replace(/\r/g, '')
        .trim();

      if (!original) {
        return false;
      }

      const n = normalizarExtracao(original);

      if (
        /^MINISTERIO (DA|DE|DO|DOS|DAS)\b/.test(n)
      ) {
        if (original.length <= 120) {
          return true;
        }
      }

      const superiores = [
        /^PRESIDENCIA DA REPUBLICA$/,
        /^VICE-PRESIDENCIA DA REPUBLICA$/,
        /^BANCO CENTRAL DO BRASIL$/,
        /^ADVOCACIA-GERAL DA UNIAO$/,
        /^CONTROLADORIA-GERAL DA UNIAO$/,
        /^DEFENSORIA PUBLICA DA UNIAO$/
      ];

      if (superiores.some(regex => regex.test(n))) {
        return true;
      }

      if (!linhaEmCaixaAltaExtracao(original)) {
        return false;
      }

      if (original.length > 180) {
        return false;
      }

      const padroes = [
        /^AGENCIA NACIONAL\b/,
        /^DEPARTAMENTO NACIONAL\b/,
        /^SUPERINTENDENCIA REGIONAL\b/,
        /^SECRETARIA NACIONAL\b/,
        /^SECRETARIA ESPECIAL\b/,
        /^INSTITUTO NACIONAL\b/,
        /^FUNDACAO NACIONAL\b/,
        /^EMPRESA BRASILEIRA\b/,
        /^CONSELHO NACIONAL\b/,
        /^TRIBUNAL\b/,
        /^AUTORIDADE NACIONAL\b/,
        /^SERVICO FEDERAL\b/,
        /^SERVICO NACIONAL\b/,
        /^EMBRAPA\b/,
        /^DATAPREV\b/,
        /^SERPRO\b/,
        /^EBSERH\b/,
        /^INCRA\b/,
        /^IBAMA\b/,
        /^ICMBIO\b/,
        /^ANVISA\b/,
        /^ANATEL\b/,
        /^ANEEL\b/,
        /^ANAC\b/,
        /^ANTAQ\b/,
        /^DNIT\b/
      ];

      return padroes.some(regex => regex.test(n));
    }

    function encontrarMudancaOrgaoPorLinha(
      texto,
      inicio,
      limite
    ) {
      const trecho = texto.substring(inicio, limite);

      let deslocamento = 0;

      const linhas = trecho.split('\n');

      for (let i = 0; i < linhas.length; i++) {
        const linhaOriginal = linhas[i];
        const linha = linhaOriginal.trim();

        const posicaoLinha = inicio + deslocamento;

        deslocamento += linhaOriginal.length + 1;

        if (
          posicaoLinha <
          inicio + 250
        ) {
          continue;
        }

        if (ehCabecalhoInstitucionalForte(linha)) {
          return posicaoLinha;
        }
      }

      return -1;
    }

    function encontrarMudancaOrgaoColapsado(
      texto,
      inicio,
      limite
    ) {
      const trecho = texto.substring(inicio, limite);

      const padrao =
        /\b(?:DEPARTAMENTO NACIONAL|SUPERINTENDÊNCIA REGIONAL|SECRETARIA NACIONAL|SECRETARIA ESPECIAL|INSTITUTO NACIONAL|FUNDAÇÃO NACIONAL|EMPRESA BRASILEIRA|CONSELHO NACIONAL|AUTORIDADE NACIONAL|BANCO CENTRAL DO BRASIL|ADVOCACIA-GERAL DA UNIÃO|CONTROLADORIA-GERAL DA UNIÃO|DEFENSORIA PÚBLICA DA UNIÃO|EMBRAPA|DATAPREV|SERPRO|EBSERH|INCRA|IBAMA|ICMBIO|ANVISA|ANATEL|ANEEL|ANAC|ANTAQ|DNIT)\b/g;

      let match;

      while (
        (match = padrao.exec(trecho)) !== null
      ) {
        if (match.index < 250) {
          continue;
        }

        const antes = trecho.substring(
          Math.max(0, match.index - 150),
          match.index
        );

        if (
          /\b(?:DA|DE|DO|DAS|DOS|PELA|PELO|NA|NO|A|O)\s*$/i.test(
            antes.trim()
          )
        ) {
          continue;
        }

        return (
          inicio +
          match.index
        );
      }

      return -1;
    }

    function encontrarMudancaSeguraDeOrgao(
      texto,
      inicio,
      limite
    ) {
      const porLinha =
        encontrarMudancaOrgaoPorLinha(
          texto,
          inicio,
          limite
        );

      const colapsado =
        encontrarMudancaOrgaoColapsado(
          texto,
          inicio,
          limite
        );

      const encontrados = [
        porLinha,
        colapsado
      ].filter(valor => valor !== -1);

      if (encontrados.length === 0) {
        return -1;
      }

      return Math.min(...encontrados);
    }

    function limparRuidoDOU(
      conteudo,
      cabecalhoOriginal
    ) {
      let texto = String(conteudo || '')
        .replace(/\r/g, '');

      const cabecalho = limparTexto(
        cabecalhoOriginal
      );

      texto = texto.replace(
        /Documento assinado digitalmente conforme MP nº 2\.200-2[\s\S]*?(?:Seção\s*[123]\s+ISSN\s+\d{4}-\d{4}\s+Nº\s+\d+,[^\n]*|Nº\s+\d+,[^\n]*ISSN\s+\d{4}-\d{4}[^\n]*Seção\s*[123])/gi,
        '\n'
      );

      texto = texto.replace(
        /Documento assinado digitalmente conforme MP nº 2\.200-2[^\n]*\nque institui[^\n]*\nEste documento pode ser verificado[^\n]*\nhttps?:\/\/[^\n]*\n\d{1,4}\n(?:Seção\s*[123][^\n]*|Nº\s+\d+,[^\n]*)/gi,
        '\n'
      );

      texto = texto.replace(
        /<PARSED TEXT FOR PAGE:\s*\d+\s*\/\s*\d+>/gi,
        '\n'
      );

      texto = texto.replace(
        /Seção\s*[123]\s+ISSN\s+\d{4}-\d{4}\s+Nº\s+\d+,[^\n]*/gi,
        '\n'
      );

      texto = texto.replace(
        /Nº\s+\d+,[^\n]*ISSN\s+\d{4}-\d{4}[^\n]*Seção\s*[123]/gi,
        '\n'
      );

      texto = texto.replace(
        /\bSeção\s*[123]\b/gi,
        ''
      );

      texto = texto.replace(
        /^Documento assinado digitalmente conforme MP[^\n]*$/gmi,
        ''
      );

      texto = texto.replace(
        /^que institui a Infraestrutura de Chaves Públicas Brasileira[^\n]*$/gmi,
        ''
      );

      texto = texto.replace(
        /^Este documento pode ser verificado no endereço eletrônico[^\n]*$/gmi,
        ''
      );

      texto = texto.replace(
        /^https?:\/\/www\.in\.gov\.br\/autenticidade\.html[^\n]*$/gmi,
        ''
      );

      texto = texto.replace(
        /^\s*\d{1,4}\s*$/gm,
        ''
      );

      if (cabecalho) {
        const textoSemAsteriscos =
          texto.replace(/\*/g, '');

        const primeira =
          textoSemAsteriscos.indexOf(
            cabecalho
          );

        if (primeira !== -1) {
          const segunda =
            textoSemAsteriscos.indexOf(
              cabecalho,
              primeira +
              cabecalho.length
            );

          if (segunda !== -1) {
            texto =
              texto.substring(
                0,
                segunda
              );
          }
        }
      }

      return texto
        .replace(/\u00A0/g, ' ')
        .replace(/[ \t]+/g, ' ')
        .replace(/\n{3,}/g, '\n\n')
        .trim();
    }

    function extrairPublicacoesCompletas(
      textoCompleto,
      lista,
      secao
    ) {
      const saida = [];

      const ordenados = [...lista].sort(
        (a, b) =>
          Number(a.posicao) -
          Number(b.posicao)
      );

      for (
        let i = 0;
        i < ordenados.length;
        i++
      ) {
        const atual = ordenados[i];
        const proximo = ordenados[i + 1];

        const inicio =
          Number(atual.posicao);

        const contextoOrgao =
          encontrarContextoInstitucional(
            textoCompleto,
            inicio
          );

        const contextoANTT =
          contextoEhANTT(
            contextoOrgao
          );

        let fim =
          proximo
            ? Number(proximo.posicao)
            : textoCompleto.length;

        const mudancaOrgao =
          encontrarMudancaSeguraDeOrgao(
            textoCompleto,
            inicio,
            fim
          );

        if (
          mudancaOrgao !== -1 &&
          mudancaOrgao > inicio &&
          mudancaOrgao < fim
        ) {
          fim = mudancaOrgao;
        }

        let conteudo =
          textoCompleto.substring(
            inicio,
            fim
          );

        conteudo =
          limparRuidoDOU(
            conteudo,
            atual.cabecalhoEncontrado
          );

        conteudo =
          limparTexto(
            conteudo
          );

        let cabecalho =
          limparTexto(
            atual.cabecalhoEncontrado
          );

        const primeiraLinha =
          conteudo
            .split('\n')[0]
            ?.trim();

        if (
          primeiraLinha &&
          ehCabecalhoPublicacao(
            primeiraLinha
          )
        ) {
          cabecalho =
            primeiraLinha;
        }

        let corpo =
          conteudo;

        if (
          cabecalho &&
          corpo.startsWith(
            cabecalho
          )
        ) {
          corpo =
            corpo.substring(
              cabecalho.length
            )
            .trim();
        }

        saida.push({
          secao: String(secao),
          indice: Number(atual.indice || 0),
          posicao_inicio: inicio,
          posicao_fim: fim,
          cabecalho_detectado:
            String(
              atual.cabecalhoEncontrado || ''
            ),
          cabecalho,
          corpo,
          conteudo,
          tamanho_conteudo:
            conteudo.length,
          contexto_orgao:
            contextoOrgao,
          contexto_antt:
            contextoANTT
        });
      }

      return saida;
    }

    function normalizarRelevancia(texto) {
      return String(texto || '')
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .replace(/\u00A0/g, ' ')
        .replace(/\r/g, '')
        .replace(/[ \t]+/g, ' ')
        .toUpperCase()
        .trim();
    }

    function mencionaANTT(texto) {
      const n = normalizarRelevancia(texto);

      return (
        /AGENCIA NACIONAL DE TRANSPORTES TERRESTRES/.test(n) ||
        /\bANTT\b/.test(n) ||
        /GOV\.BR\/ANTT/.test(n) ||
        /@ANTT\.GOV\.BR/.test(n)
      );
    }

    function ehTituloSecao3(titulo) {
      const n = normalizarRelevancia(titulo);

      return (
        /^EXTRATO\b/.test(n) ||
        /^EXTRATOS\b/.test(n) ||
        /^EDITAL\b/.test(n) ||
        /^EDITAIS\b/.test(n) ||
        /^AVISO\b/.test(n) ||
        /^AVISOS\b/.test(n) ||
        /^COMUNICADO\b/.test(n) ||
        /^COMUNICADOS\b/.test(n) ||
        /^RESULTADO\b/.test(n) ||
        /^RESULTADOS\b/.test(n) ||
        /^RETIFICACAO\b/.test(n)
      );
    }

    function cabecalhoIdentificaANTT(cabecalho) {
      const titulo = normalizarRelevancia(cabecalho);

      if (!ehTituloSecao3(titulo)) {
        return false;
      }

      if (/\bANTT\b/.test(titulo)) {
        return true;
      }

      const siglasANTT = [
        /\bSUROD\b/,
        /\bSUROC\b/,
        /\bSUPAS\b/,
        /\bSUFER\b/,
        /\bSUESP\b/,
        /\bSUDEG\b/,
        /\bSUSPI\b/,
        /\bGEAUT\b/
      ];

      if (
        siglasANTT.some(
          regex => regex.test(titulo)
        )
      ) {
        return true;
      }

      return false;
    }

    function inicioIdentificaAutoriaANTT(
      cabecalho,
      corpo
    ) {
      const textoInicial =
        normalizarRelevancia(
          `${cabecalho}\n${corpo}`
        ).slice(
          0,
          1500
        );

      const padroesInicio = [
        /AGENCIA NACIONAL DE TRANSPORTES TERRESTRES\s*-\s*ANTT.{0,350}TORNA PUBLICO/,
        /AGENCIA NACIONAL DE TRANSPORTES TERRESTRES\s*-\s*ANTT.{0,350}NO USO DE SUAS ATRIBUICOES/,
        /AGENCIA NACIONAL DE TRANSPORTES TERRESTRES\s*-\s*ANTT.{0,350}NOTIFICA/,
        /AGENCIA NACIONAL DE TRANSPORTES TERRESTRES\s*-\s*ANTT.{0,350}COMUNICA/,
        /AGENCIA NACIONAL DE TRANSPORTES TERRESTRES\s*-\s*ANTT.{0,350}INFORMA/,
        /AGENCIA NACIONAL DE TRANSPORTES TERRESTRES\s*-\s*ANTT.{0,350}FAZ SABER/
      ];

      return padroesInicio.some(
        regex =>
          regex.test(textoInicial)
      );

    function identificarANTTDireto(
      secao,
      cabecalho,
      corpo,
      conteudo,
      contextoANTT
    ) {
      const titulo =
        normalizarRelevancia(cabecalho);

      const texto =
        normalizarRelevancia(
          `${cabecalho}\n${corpo}\n${conteudo}`
        );

      if (
        contextoANTT === true
      ) {
        return true;
      }

      if (
        String(secao) === '1'
      ) {
        const padroesSecao1 = [
          /^DELIBERACAO ANTT Nº/,
          /^RESOLUCAO ANTT Nº/,
          /^INSTRUCAO NORMATIVA ANTT Nº/,
          /^PORTARIA ANTT Nº/,
          /^PORTARIA SUSPI Nº/,
          /^PORTARIA SUROD Nº/,
          /^PORTARIA SUPAS Nº/,
          /^PORTARIA SUFER Nº/,
          /^PORTARIA SUDEG Nº/,
          /^DECISAO SUROD Nº/,
          /^DECISAO SUROC Nº/,
          /^DECISAO SUFER Nº/,
          /^DECISAO SUPAS Nº/,
          /^DECISAO SUESP Nº/
        ];

        if (
          padroesSecao1.some(
            regex =>
              regex.test(titulo)
          )
        ) {
          return true;
        }
      }

      const autoriaANTT = [
        /DIRETORIA COLEGIADA DA AGENCIA NACIONAL DE TRANSPORTES TERRESTRES/,
        /DIRETOR-GERAL DA AGENCIA NACIONAL DE TRANSPORTES TERRESTRES/,
        /DIRETOR GERAL DA AGENCIA NACIONAL DE TRANSPORTES TERRESTRES/,
        /DIRETOR-GERAL DA ANTT/,
        /DIRETOR GERAL DA ANTT/,
        /SUPERINTENDENTE DA AGENCIA NACIONAL DE TRANSPORTES TERRESTRES/,
        /SUPERINTENDENTE DE .* DA AGENCIA NACIONAL DE TRANSPORTES TERRESTRES/,
        /AGENCIA NACIONAL DE TRANSPORTES TERRESTRES\s*-\s*ANTT.{0,250}NO USO DE SUAS ATRIBUICOES/
      ];

      if (
        autoriaANTT.some(
          regex =>
            regex.test(texto)
        )
      ) {
        return true;
      }

      if (
        String(secao) === '3'
      ) {
        if (
          cabecalhoIdentificaANTT(
            titulo
          )
        ) {
          return true;
        }

        if (
          inicioIdentificaAutoriaANTT(
            cabecalho,
            corpo
          )
        ) {
          return true;
        }

        const camposANTT = [
          /CONTRATANTE\s*:?\s*(?:AGENCIA NACIONAL DE TRANSPORTES TERRESTRES|ANTT)/,
          /CONCEDENTE\s*:?\s*(?:AGENCIA NACIONAL DE TRANSPORTES TERRESTRES|ANTT)/,
          /CONVENENTE\s*:?\s*(?:AGENCIA NACIONAL DE TRANSPORTES TERRESTRES|ANTT)/,
          /ORGAO RESPONSAVEL\s*:?\s*(?:AGENCIA NACIONAL DE TRANSPORTES TERRESTRES|ANTT)/,
          /UNIDADE GESTORA\s*:?\s*(?:AGENCIA NACIONAL DE TRANSPORTES TERRESTRES|ANTT)/,
          /INTERESSADO\s*:?\s*(?:AGENCIA NACIONAL DE TRANSPORTES TERRESTRES|ANTT)/
        ];

        if (
          camposANTT.some(
            regex =>
              regex.test(texto)
          )
        ) {
          return true;
        }

        if (
          ehTituloSecao3(titulo) &&
          /DIRETORIA COLEGIADA DA AGENCIA NACIONAL DE TRANSPORTES TERRESTRES/.test(texto)
        ) {
          return true;
        }
      }

      if (
        String(secao) === '2'
      ) {
        if (
          mencionaANTT(texto) &&
          (
            /AGENCIA NACIONAL DE TRANSPORTES TERRESTRES/.test(texto) ||
            /DIRETOR-GERAL DA ANTT/.test(texto) ||
            /DIRETOR GERAL DA ANTT/.test(texto)
          )
        ) {
          return true;
        }
      }

      return false;
    }

    function classificarRelevanciaPublicacoes(
      publicacoes
    ) {
      const saida = [];

      for (
        const item of publicacoes
      ) {
        const secao =
          String(
            item.secao || ''
          );

        const cabecalho =
          String(
            item.cabecalho ||

        const conteudo =
          String(
            item.conteudo ||
            `${cabecalho}\n${corpo}`
          );

        const contextoOrgao =
          String(
            item.contexto_orgao || ''
          );

        const contextoANTT =
          item.contexto_antt === true;

        const temMencaoANTT =
          mencionaANTT(
            conteudo
          );

        const anttDireto =
          identificarANTTDireto(
            secao,
            cabecalho,
            corpo,
            conteudo,
            contextoANTT
          );

        let classificacao =
          'NAO_RELEVANTE';

        let relevancia =
          'DESCARTAR';

        let motivo =
          'Publicação sem vínculo identificado com a ANTT.';

        if (
          anttDireto

          classificacao =
            'ANTT_DIRETO';

          relevancia =
            'RELEVANTE';

          if (
            contextoANTT
          ) {
            motivo =
              'Publicação vinculada ao contexto institucional da ANTT.';
          } else {
            motivo =
              'Publicação identificada como ato direto da ANTT.';
          }
        }

        else if (
          temMencaoANTT
        ) {
          classificacao =
            'OUTRO_ORGAO_CITA_ANTT';

          relevancia =
            'RELEVANTE';

          motivo =
            contextoOrgao
              ? `Publicação de outro órgão que menciona a ANTT. Contexto: ${contextoOrgao}`
              : 'Publicação de outro órgão que menciona a ANTT.';
        }

        else {
          const tituloNormalizado =
            normalizarRelevancia(
              cabecalho
            );

          if (
            tituloNormalizado === 'RETIFICACAO' ||
            tituloNormalizado === 'SUMULA'
          ) {
            classificacao =
              'NAO_RELEVANTE';

            relevancia =
              'DESCARTAR';

            if (
              contextoOrgao
            ) {
              motivo =
                `Retificação ou súmula sem menção à ANTT. Contexto: ${contextoOrgao}`;
            } else {
              motivo =
                'Retificação ou súmula sem menção à ANTT.';
            }
          }
        }

        const resultado = {
          ...item,
          menciona_antt:
            temMencaoANTT,
          antt_direto:
            anttDireto,
          classificacao,
          relevancia,
          motivo
        };

        if (
          resultado.relevancia === 'RELEVANTE' ||
          resultado.relevancia === 'ANALISAR'
        ) {
          saida.push(
            resultado
          );
        }
      }

      return saida;
    }

    // ============================================================

    function normalizarContexto(texto) {
      return String(texto || '')
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .replace(/\u00A0/g, ' ')
        .replace(/\r/g, '')
        .replace(/[ \t]+/g, ' ')
        .toUpperCase()
        .trim();
    }

    function limparLinhaContexto(texto) {
      return String(texto || '')
        .replace(/\r/g, '')
        .replace(/\u00A0/g, ' ')
        .replace(/\*/g, '')
        .replace(/[ \t]+/g, ' ')
        .trim();
    }

    function linhaEmCaixaAltaContexto(linha) {
      const texto =
        limparLinhaContexto(linha);

      if (!texto) {
        return false;
      }

      const letras =
        texto.replace(
          /[^A-Za-zÀ-ÖØ-öø-ÿ]/g,
          ''
        );

      if (!letras) {
        return false;
      }

      return (
        letras ===
        letras.toUpperCase()
      );
    }

    function ehCabecalhoPublicacaoContexto(linha) {
      const n =
        normalizarContexto(linha);

      const padroes = [
        /^PORTARIA\b/,
        /^DELIBERACAO\b/,
        /^RESOLUCAO\b/,
        /^INSTRUCAO NORMATIVA\b/,
        /^DECISAO\b/,
        /^DESPACHO\b/,
        /^EXTRATO\b/,
        /^EXTRATOS\b/,
        /^EDITAL\b/,
        /^EDITAIS\b/,
        /^AVISO\b/,
        /^AVISOS\b/,
        /^COMUNICADO\b/,
        /^COMUNICADOS\b/,
        /^RESULTADO DE JULGAMENTO\b/,
        /^RESULTADOS DE JULGAMENTO\b/,
        /^RETIFICACAO\b/,
        /^SUMULA\b/
      ];

      return padroes.some(
        regex => regex.test(n)
      );
    }

    function ehLinhaInstitucionalContexto(linha) {
      const original =
        limparLinhaContexto(linha);

      if (!original) {
        return false;
      }

      if (
        original.length > 200
      ) {
        return false;
      }

      const n =
        normalizarContexto(original);

      if (
        /^MINISTERIO (DOS|DAS|DO|DA|DE)\b/.test(n)
      ) {
        return true;
      }

      if (
        !linhaEmCaixaAltaContexto(original)
      ) {
        return false;
      }

      const padroes = [
        /^PRESIDENCIA DA REPUBLICA\b/,
        /^VICE-PRESIDENCIA DA REPUBLICA\b/,
        /^AGENCIA NACIONAL\b/,
        /^DEPARTAMENTO NACIONAL\b/,
        /^DIRETORIA COLEGIADA\b/,
        /^DIRETORIA\b/,
        /^SUPERINTENDENCIA\b/,
        /^SECRETARIA\b/,
        /^GERENCIA\b/,
        /^COORDENACAO\b/,
        /^INSTITUTO NACIONAL\b/,
        /^FUNDACAO NACIONAL\b/,
        /^EMPRESA BRASILEIRA\b/,
        /^BANCO CENTRAL DO BRASIL\b/,
        /^ADVOCACIA-GERAL DA UNIAO\b/,
        /^CONTROLADORIA-GERAL DA UNIAO\b/,
        /^DEFENSORIA PUBLICA DA UNIAO\b/,
        /^CONSELHO NACIONAL\b/,
        /^AUTORIDADE NACIONAL\b/,
        /^TRIBUNAL\b/,
        /^POLICIA RODOVIARIA FEDERAL\b/,
        /^POLICIA FEDERAL\b/,
        /^EMBRAPA\b/,
        /^DATAPREV\b/,
        /^SERPRO\b/,
        /^EBSERH\b/,
        /^INCRA\b/,
        /^IBAMA\b/,
        /^ICMBIO\b/,
        /^ANVISA\b/,
        /^ANATEL\b/,
        /^ANEEL\b/,
        /^ANAC\b/,
        /^ANTAQ\b/,
        /^ANTT\b/,
        /^DNIT\b/,
        /^PREFEITURA MUNICIPAL\b/,
        /^GOVERNO DO ESTADO\b/,
        /^GOVERNO DO DISTRITO FEDERAL\b/
      ];

      return padroes.some(
        regex => regex.test(n)
      );
    }

    function linhaEhANTTContexto(linha) {
      const n =
        normalizarContexto(linha);

      return (
        /AGENCIA NACIONAL DE TRANSPORTES TERRESTRES/.test(n) ||
        n === 'ANTT'
      );
    }

    function encontrarContextoCorrigido(
      texto,
      posicaoInicio
    ) {
      if (
        !texto ||
        !Number.isFinite(posicaoInicio)
      ) {
        return {
          contexto: '',
          contextoANTT: false
        };
      }

      const inicioBusca =
        Math.max(
          0,
          posicaoInicio - 10000
        );

      const trecho =
        texto.substring(
          inicioBusca,
          posicaoInicio
        );

      const linhas =
        trecho
          .split('\n')
          .map(
            limparLinhaContexto
          );

      const contextoInvertido = [];

      let encontrouInstitucional =
        false;

      for (
        let i = linhas.length - 1;
        i >= 0;
        i--
      ) {
        const linha =
          linhas[i];

        if (!linha) {
          continue;
        }

        if (
          ehCabecalhoPublicacaoContexto(
            linha
          )
        ) {
          if (
            encontrouInstitucional
          ) {
            break;
          }

          continue;
        }

        if (
          !ehLinhaInstitucionalContexto(
            linha
          )
        ) {
          continue;
        }

        encontrouInstitucional =
          true;

        contextoInvertido.push(
          linha
        );

        if (
          linhaEhANTTContexto(
            linha
          )
        ) {
          for (
            let j = i - 1;
            j >= Math.max(
              0,
              i - 20
            );
            j--
          ) {
            const anterior =
              linhas[j];

            if (!anterior) {
              continue;
            }

            const nAnterior =
              normalizarContexto(
                anterior
              );

            if (
              /^MINISTERIO DOS TRANSPORTES\b/.test(
                nAnterior
              )
            ) {
              contextoInvertido.push(
                anterior
              );

              break;
            }

            if (
              ehLinhaInstitucionalContexto(
                anterior
              ) &&
              !/^DIRETORIA\b/.test(
                nAnterior
              ) &&
              !/^SUPERINTENDENCIA\b/.test(
                nAnterior
              ) &&
              !/^GERENCIA\b/.test(
                nAnterior
              ) &&
              !/^COORDENACAO\b/.test(
                nAnterior
              )
            ) {
              break;
            }
          }

          break;
        }

        const n =
          normalizarContexto(
            linha
          );

        const ehOrgaoPrincipal = (
          /^MINISTERIO\b/.test(n) ||
          /^AGENCIA NACIONAL\b/.test(n) ||
          /^DEPARTAMENTO NACIONAL\b/.test(n) ||
          /^POLICIA RODOVIARIA FEDERAL\b/.test(n) ||
          /^POLICIA FEDERAL\b/.test(n) ||
          /^INSTITUTO NACIONAL\b/.test(n) ||
          /^FUNDACAO NACIONAL\b/.test(n) ||
          /^EMPRESA BRASILEIRA\b/.test(n) ||
          /^BANCO CENTRAL DO BRASIL\b/.test(n) ||
          /^ADVOCACIA-GERAL DA UNIAO\b/.test(n) ||
          /^CONTROLADORIA-GERAL DA UNIAO\b/.test(n) ||
          /^DEFENSORIA PUBLICA DA UNIAO\b/.test(n) ||
          /^PREFEITURA MUNICIPAL\b/.test(n) ||
          /^GOVERNO DO ESTADO\b/.test(n) ||
          /^GOVERNO DO DISTRITO FEDERAL\b/.test(n) ||
          /^EMBRAPA\b/.test(n) ||
          /^DATAPREV\b/.test(n) ||
          /^SERPRO\b/.test(n) ||
          /^EBSERH\b/.test(n) ||
          /^INCRA\b/.test(n) ||
          /^IBAMA\b/.test(n) ||
          /^ICMBIO\b/.test(n) ||
          /^ANVISA\b/.test(n) ||
          /^ANATEL\b/.test(n) ||
          /^ANEEL\b/.test(n) ||
          /^ANAC\b/.test(n) ||
          /^ANTAQ\b/.test(n) ||
          /^DNIT\b/.test(n)
        );

        if (
          ehOrgaoPrincipal
        ) {
          break;
        }

        if (
          contextoInvertido.length >= 5
        ) {
          break;
        }
      }

      const contextoLinhas =
        contextoInvertido.reverse();

      const contextoSemDuplicados = [];

      for (
        const linha of contextoLinhas
      ) {
        if (
          !contextoSemDuplicados.some(
            existente =>
              normalizarContexto(
                existente
              ) ===
              normalizarContexto(
                linha
              )
          )
        ) {
          contextoSemDuplicados.push(
            linha
          );
        }
      }

      const contexto =
        contextoSemDuplicados
          .join('\n')
          .trim();

      const contextoANTT =
        contextoSemDuplicados.some(
          linha =>
            linhaEhANTTContexto(
              linha
            )
        );

      return {
        contexto,
        contextoANTT
      };
    }

    function corrigirContextos(
      lista,
      textoSecao
    ) {
      const saida = [];

      for (
        const item of lista
      ) {
        const posicaoInicio =
          Number(
            item.posicao_inicio ??
            item.posicao ??
            0
          );

        const resultado =
          encontrarContextoCorrigido(
            textoSecao,
            posicaoInicio
          );

        let contextoFinal =
          resultado.contexto;

        let contextoANTTFinal =
          resultado.contextoANTT;

        if (
          item.classificacao ===
          'ANTT_DIRETO'
        ) {
          contextoANTTFinal =
            true;

          if (
            !contextoFinal ||
            !/AGÊNCIA NACIONAL DE TRANSPORTES TERRESTRES/i.test(
              contextoFinal
            )
          ) {
            contextoFinal =
              'AGÊNCIA NACIONAL DE TRANSPORTES TERRESTRES';
          }
        }

        saida.push({
          ...item,
          contexto_orgao_original:
            item.contexto_orgao || '',
          contexto_orgao_corrigido:
            contextoFinal,
          contexto_orgao:
            contextoFinal,
          contexto_antt:
            contextoANTTFinal
        });
      }

      return saida;
    }

            <strong>Seção 1:</strong>
            ${c1.length}
          </p>

          <p>
            <strong>Seção 2:</strong>
            ${c2.length}
          </p>

          <p>
            <strong>Seção 3:</strong>
            ${c3.length}
          </p>

          <p>
            <strong>Total:</strong>
            ${todos.length}
          </p>

          <hr>

          <strong>
            Publicações de outros órgãos que citam a ANTT
          </strong>

          ${listarExternos(externos)}

          <br>

          <strong>
            Migração principal concluída.
          </strong>

          <br>
          Próxima etapa:
          preparar os dados finais para Google Sheets e para o boletim.
        </div>
      `;
    }


    function obterPublicacoesFinaisParaEnvio() {
      const fonte =
        window.contextosCorrigidosDOU &&
        (
          window.contextosCorrigidosDOU[1]?.length ||
          window.contextosCorrigidosDOU[2]?.length ||
          window.contextosCorrigidosDOU[3]?.length
        )
          ? window.contextosCorrigidosDOU
          : window.relevantesDOU;

      return [
        ...(fonte?.[1] || []),
        ...(fonte?.[2] || []),
        ...(fonte?.[3] || [])
      ];
    }

    function formatarDataDOUParaEnvio(valor) {
      const texto = String(valor || '').trim();

      if (!texto) {
        return '';
      }

      const m = texto.match(
        /^(\d{4})-(\d{2})-(\d{2})$/
      );

      if (m) {
        return `${m[3]}/${m[2]}/${m[1]}`;
      }

      return texto;
    }

    function obterDataDOUInformada() {
      const possiveisIds = [
        'dataDOU',
        'data_dou',
        'dataDou',
        'data'
      ];

      for (const id of possiveisIds) {
        const el = document.getElementById(id);

        if (
          el &&
          typeof el.value !== 'undefined' &&
          String(el.value).trim()
        ) {
          return formatarDataDOUParaEnvio(
            el.value
          );
        }
      }

      const dateInput =
        document.querySelector(
          'input[type="date"]'
        );

      if (
        dateInput &&
        String(dateInput.value).trim()
      ) {
        return formatarDataDOUParaEnvio(
          dateInput.value
        );
      }

      return '';
    }

    function obterNumeroDOUInformado() {
      const possiveisIds = [
        'numeroDOU',
        'numero_dou',
        'numeroDou'
      ];

      for (const id of possiveisIds) {
        const el = document.getElementById(id);

        if (
          el &&
          typeof el.value !== 'undefined' &&
          String(el.value).trim()
        ) {
          return String(
            el.value
          ).trim();
        }
      }

      return '';
    }

    async function enviarParaGoogleSheets() {
      const status =
        document.getElementById(
          'statusGoogleSheets'
        );

      const botao =
        document.getElementById(
          'btnEnviarSheets'
        );

      const url =
        String(
          document.getElementById(
            'urlAppsScript'
          )?.value || ''
        ).trim();

      const chave =
        String(
          document.getElementById(
            'chaveApiSheets'
          )?.value || ''
        );

      const publicacoes =
        obterPublicacoesFinaisParaEnvio();

      if (!url) {
        status.innerHTML =
          '<strong>Informe a URL do App da Web.</strong>';

        return;
      }

      if (!/\/exec(?:\?.*)?$/.test(url)) {
        status.innerHTML =
          '<strong>A URL informada não parece ser a URL /exec do App da Web.</strong>';

        return;
      }

      if (!chave) {
        status.innerHTML =
          '<strong>Digite a chave de acesso.</strong>';

        return;
      }

      if (
        publicacoes.length === 0
      ) {
        status.innerHTML =
          '<strong>Processe os PDFs antes de enviar para o Google Sheets.</strong>';

        return;
      }

      const dataDOU =
        obterDataDOUInformada();

      const numeroDOU =
        obterNumeroDOUInformado();

      const publicacoesPreparadas =
        publicacoes.map(
          item => ({
            data_dou:
              dataDOU,
            numero_dou:
              numeroDOU,
            secao:
              item.secao || '',
            indice:
              item.indice ?? '',
            cabecalho:
              item.cabecalho ||
              item.cabecalho_detectado ||
              '',
            classificacao:
              item.classificacao || '',
            contexto_orgao:
              item.contexto_orgao ||
              item.contexto_orgao_corrigido ||
              '',
            contexto_antt:
              item.contexto_antt === true,
            corpo:
              item.corpo || '',
            conteudo:
              item.conteudo || ''
          })
        );

      botao.disabled = true;

      status.innerHTML =
        `<strong>Enviando ${publicacoesPreparadas.length} publicações para o Google Sheets...</strong>`;

      try {
        await fetch(
          url,
          {
            method: 'POST',
            mode: 'no-cors',
            headers: {
              'Content-Type':
                'text/plain;charset=utf-8'
            },
            body: JSON.stringify({
              chave_api:
                chave,
              publicacoes:
                publicacoesPreparadas
            })
          }
        );

        status.innerHTML = `
          <strong>Envio realizado.</strong>
          <br>
          ${publicacoesPreparadas.length}
          publicações foram enviadas ao Apps Script.
          <br>
          Confira a planilha para confirmar a gravação.
        `;

      } catch (erro) {
        console.error(
          'Erro ao enviar para Google Sheets:',
          erro
        );

        status.innerHTML = `
          <strong>Erro ao enviar.</strong>
          <br>
          ${escaparHTML(
            erro.message ||
            String(erro)
          )}
        `;
      } finally {
        botao.disabled = false;
      }
    }



    function obterPublicacoesParaBoletim() {
      const fonte =
        window.contextosCorrigidosDOU &&
        (
          window.contextosCorrigidosDOU[1]?.length ||
          window.contextosCorrigidosDOU[2]?.length ||
          window.contextosCorrigidosDOU[3]?.length
        )
          ? window.contextosCorrigidosDOU
          : window.relevantesDOU;

      return {
        1: [...(fonte?.[1] || [])],
        2: [...(fonte?.[2] || [])],
        3: [...(fonte?.[3] || [])]
      };
    }

    function escaparHTMLBoletim(texto) {
      return String(texto || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function normalizarLinhaUnidade(texto) {
      return String(texto || '')
        .replace(/\s+/g, ' ')
        .trim();
    }

    function detectarUnidadeANTT(item) {
      const conteudo = String(
        item.conteudo ||
        `${item.cabecalho || ''}\n${item.corpo || ''}`
      );

      const n = normalizarRelevancia(conteudo);

      const mapa = [
        {
          regex: /DIRETORIA COLEGIADA/,
          nome: 'DIRETORIA COLEGIADA'
        },
        {
          regex: /SUPERINTENDENCIA DE INFRAESTRUTURA RODOVIARIA/,
          nome: 'SUPERINTENDÊNCIA DE INFRAESTRUTURA RODOVIÁRIA'
        },
        {
          regex: /SUPERINTENDENCIA DE SERVICOS DE TRANSPORTE RODOVIARIO DE PASSAGEIROS/,
          nome: 'SUPERINTENDÊNCIA DE SERVIÇOS DE TRANSPORTE RODOVIÁRIO DE PASSAGEIROS'
        },
        {
          regex: /SUPERINTENDENCIA DE TRANSPORTE FERROVIARIO/,
          nome: 'SUPERINTENDÊNCIA DE TRANSPORTE FERROVIÁRIO'
        },
        {
          regex: /SUPERINTENDENCIA DE SERVICOS DE TRANSPORTE RODOVIARIO E MULTIMODAL DE CARGAS/,
          nome: 'SUPERINTENDÊNCIA DE SERVIÇOS DE TRANSPORTE RODOVIÁRIO E MULTIMODAL DE CARGAS'
        },
        {
          regex: /SUPERINTENDENCIA DE GESTAO ADMINISTRATIVA/,
          nome: 'SUPERINTENDÊNCIA DE GESTÃO ADMINISTRATIVA'
        },
        {
          regex: /COMISSOES DE OUTORGA/,
          nome: 'COMISSÕES DE OUTORGA'
        },
        {
          regex: /COMISSAO DE OUTORGA/,
          nome: 'COMISSÕES DE OUTORGA'
        }
      ];

      for (const entrada of mapa) {
        if (entrada.regex.test(n)) {
          return entrada.nome;
        }
      }

      const contexto = normalizarLinhaUnidade(
        item.contexto_orgao || ''
      );

      if (
        contexto &&
        !/AGÊNCIA NACIONAL DE TRANSPORTES TERRESTRES/i.test(contexto) &&
        item.classificacao === 'ANTT_DIRETO'
      ) {
        return contexto;
      }

      return '';
    }

    function detectarOrgaoExterno(item) {
      if (
        item.classificacao !==
        'OUTRO_ORGAO_CITA_ANTT'
      ) {
        return '';
      }

      const contexto =
        normalizarLinhaUnidade(
          item.contexto_orgao || ''
        );

      return contexto;
    }

    function formatarDataExtenso(dataIso) {
      if (!dataIso) {
        return '';
      }

      const partes =
        String(dataIso).split('-');

      if (partes.length !== 3) {
        return dataIso;
      }

      const data =
        new Date(
          Number(partes[0]),
          Number(partes[1]) - 1,
          Number(partes[2])
        );

      const dias = [
        'DOMINGO',
        'SEGUNDA-FEIRA',
        'TERÇA-FEIRA',
        'QUARTA-FEIRA',
        'QUINTA-FEIRA',
        'SEXTA-FEIRA',
        'SÁBADO'
      ];

      const meses = [
        'JANEIRO',
        'FEVEREIRO',
        'MARÇO',
        'ABRIL',
        'MAIO',
        'JUNHO',
        'JULHO',
        'AGOSTO',
        'SETEMBRO',
        'OUTUBRO',
        'NOVEMBRO',
        'DEZEMBRO'
      ];

      return {
        diaSemana:
          dias[data.getDay()],
        dataExtenso:
          `${String(data.getDate()).padStart(2, '0')} DE ${meses[data.getMonth()]} DE ${data.getFullYear()}`
      };
    }

    function montarSecaoBoletim(secao, itens) {
      if (!itens.length) {
        return '';
      }

      let htmlSecao = `
        <section class="boletim-secao">
          <div class="boletim-secao-titulo">
            SEÇÃO ${secao}
          </div>

          <div class="boletim-orgao-principal">
            AGÊNCIA NACIONAL DE TRANSPORTES TERRESTRES
          </div>
      `;

      let unidadeAtual = null;
      let orgaoExternoAtual = null;

      for (const item of itens) {
        const unidade =
          detectarUnidadeANTT(item);

        const orgaoExterno =
          detectarOrgaoExterno(item);

        if (orgaoExterno) {
          if (orgaoExterno !== orgaoExternoAtual) {
            htmlSecao += `
              <div class="boletim-orgao-externo">
                ${escaparHTMLBoletim(orgaoExterno)}
              </div>
            `;

            orgaoExternoAtual =
              orgaoExterno;

            unidadeAtual =
              null;
          }
        } else {
          orgaoExternoAtual = null;

          if (
            unidade &&
            unidade !== unidadeAtual
          ) {
            htmlSecao += `
              <div class="boletim-unidade">
                ${escaparHTMLBoletim(unidade)}
              </div>
            `;

            unidadeAtual =
              unidade;
          }
        }

        const titulo =
          String(
            item.cabecalho ||
            item.cabecalho_detectado ||
            ''
          ).trim();

        const corpo =
          String(
            item.corpo ||
            item.conteudo ||
            ''
          ).trim();

        htmlSecao += `
          <article class="boletim-publicacao">
            <div class="boletim-publicacao-titulo">
              ${escaparHTMLBoletim(titulo)}
            </div>

            <div class="boletim-publicacao-corpo">
              ${escaparHTMLBoletim(corpo)}
            </div>
          </article>
        `;
      }

      htmlSecao += '</section>';

      return htmlSecao;
    }

    function gerarPreviaBoletim() {
      const status =
        document.getElementById(
          'statusBoletim'
        );

      const previa =
        document.getElementById(
          'previaBoletim'
        );

      const numero =
        String(
          document.getElementById(
            'numeroDouBoletim'
          )?.value || ''
        ).trim();

      const dataIso =
        String(
          document.getElementById(
            'dataDouBoletim'
          )?.value || ''
        ).trim();

      const publicacoes =
        obterPublicacoesParaBoletim();

      const total =
        publicacoes[1].length +
        publicacoes[2].length +
        publicacoes[3].length;

      if (total === 0) {
        status.innerHTML =
          '<strong>Processe os PDFs antes de gerar o boletim.</strong>';

        return;
      }

      if (!numero) {
        status.innerHTML =
          '<strong>Informe o número do DOU.</strong>';

        return;
      }

      if (!dataIso) {
        status.innerHTML =
          '<strong>Informe a data do DOU.</strong>';

        return;
      }

      const dataInfo =
        formatarDataExtenso(
          dataIso
        );

      const tituloFaixa =
        `DIÁRIO OFICIAL DA UNIÃO – DOU Nº ${escaparHTMLBoletim(numero)}, ${dataInfo.diaSemana}, ${dataInfo.dataExtenso}`;

      previa.innerHTML = `
        <div class="boletim-preview">

          <div class="boletim-banner">
            <div class="antt">
              ANTT
              <div style="font-size:13px;font-weight:600;margin-top:4px;">
                AGÊNCIA NACIONAL DE TRANSPORTES TERRESTRES
              </div>
            </div>

            <div class="dou-legis">
              DIÁRIO OFICIAL DA UNIÃO e ANTTLegis
              <div style="font-size:16px;font-weight:500;margin-top:4px;">
                Publicações Oficiais
              </div>
            </div>
          </div>

          <div class="boletim-topo">
            <div>SECRETARIA-GERAL (SEGER)</div>
            <div>GABINETE DO DIRETOR-GERAL (GAB-DG)</div>
          </div>

          <div class="boletim-faixa">
            ${tituloFaixa}
          </div>

          <div class="boletim-conteudo">
            ${montarSecaoBoletim(1, publicacoes[1])}
            ${montarSecaoBoletim(2, publicacoes[2])}
            ${montarSecaoBoletim(3, publicacoes[3])}
          </div>

        </div>
      `;

      status.innerHTML = `
        <strong>Prévia gerada.</strong>
        <br>
        ${total} publicações incluídas no boletim.
      `;

      document.getElementById(
        'numeroDOU'
      )?.setAttribute(
        'value',
        numero
      );

      document.getElementById(
        'dataDOU'
      )?.setAttribute(
        'value',
        dataIso
      );
    }

    function imprimirBoletim() {
      const previa =
        document.getElementById(
          'previaBoletim'
        );

      if (
        !previa ||
        !previa.innerHTML.trim()
      ) {
        const status =
          document.getElementById(
            'statusBoletim'
          );

        status.innerHTML =
          '<strong>Gere a prévia antes de imprimir.</strong>';

        return;
      }

      window.print();
    }


    async function processarDOU() {
      if (!validarArquivos()) return;

      criarAreasResultado();
      btnProcessar.disabled = true;
      btnProcessar.textContent = 'PROCESSANDO...';

      window.textosDOU = { 1: '', 2: '', 3: '' };
      window.resultadoExtracaoDOU = { 1: null, 2: null, 3: null };
      window.candidatosDOU = { 1: [], 2: [], 3: [] };
    window.publicacoesDOU = { 1: [], 2: [], 3: [] };
      window.relevantesDOU = { 1: [], 2: [], 3: [] };
      window.contextosCorrigidosDOU = { 1: [], 2: [], 3: [] };

      try {
        await extrairPDF(pdfSecao1.files[0], 1);
        await extrairPDF(pdfSecao2.files[0], 2);
        await extrairPDF(pdfSecao3.files[0], 3);

        mostrarResumoExtracao();

        document.getElementById('resultadoCandidatos').innerHTML = `

        window.candidatosDOU[1] = classificarCandidatos(window.textosDOU[1], '1');

        window.candidatosDOU[2] = classificarCandidatos(window.textosDOU[2], '2');
        await new Promise(resolve => setTimeout(resolve, 0));

        window.candidatosDOU[3] = classificarCandidatos(window.textosDOU[3], '3');

        mostrarResultadoCandidatos();

        document.getElementById(

        ).innerHTML = `
          <div class="candidatos-card">
            <h3>Extraindo publicações completas...</h3>
            Aguarde.
          </div>
        `;

        await new Promise(
          resolve =>
            setTimeout(

            )
        );

          resolve =>
            setTimeout(

            )
        );

          extrairPublicacoesCompletas(
            window.textosDOU[2],
            window.candidatosDOU[2],
            '2'
          );

        await new Promise(
          resolve =>
            setTimeout(
              resolve,
              0
            )
        );

        window.publicacoesDOU[3] =
          extrairPublicacoesCompletas(

            window.candidatosDOU[3],

          );

        mostrarResultadoPublicacoes();

        document.getElementById(
          'resultadoRelevancia'

          <div class="candidatos-card">
            <h3>Classificando relevância para a ANTT...</h3>

        await new Promise(

            setTimeout(

              50
            )
        );

        await new Promise(
          resolve =>
            setTimeout(
              resolve,
              0
            )
        );

        window.relevantesDOU[2] =
          classificarRelevanciaPublicacoes(
            window.publicacoesDOU[2]
          );

        await new Promise(
          resolve =>
            setTimeout(
              resolve,
              0
            )
        );

        window.relevantesDOU[3] =
          classificarRelevanciaPublicacoes(
            window.publicacoesDOU[3]
          );

        mostrarResultadoRelevancia();

        document.getElementById(
          'resultadoContexto'
        ).innerHTML = `
          <div class="candidatos-card">
            <h3>Corrigindo contexto institucional...</h3>
            Aguarde.
          </div>
        `;

        await new Promise(
          resolve =>
            setTimeout(
              resolve,
              50
            )
        );

          corrigirContextos(

          );

        await new Promise(
          resolve =>
            setTimeout(
              resolve,
              0
            )
        );

          corrigirContextos(

          );

          resolve =>
            setTimeout(

              0
            )
        );

        window.contextosCorrigidosDOU[3] =

        mostrarResultadoContexto();

      } catch (erro) {
        console.error(erro);

        resultado.innerHTML += `
          <div class="resultado-card erro">

            ${escaparHTML(erro.message || erro)}

      } finally {
        btnProcessar.disabled = false;
        btnProcessar.textContent = 'PROCESSAR DOU';

    btnProcessar.addEventListener('click', processarDOU);
